<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
</head>
<body>
    <h1>Task List</h1>
    <table border="1">
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Created At</th>
        </tr>
        {% for task in tasks %}
        <tr>
            <td>{{ task.title }}</td>
            <td>{{ task.description }}</td>
            <td>{{ task.created_at }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No tasks found.</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="{% url 'add_task' %}">Add New Task</a>
</body>
</html>
